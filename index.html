<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אסתר ספקטור">
<meta name="theme-color" content="#4E6A2E">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>אסתר ספקטור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one-column app shell, sticky header + bottom tab bar on phone, sheets for forms. Eucalyptus & oil-amber on sage paper. */
:root{
  --bg:#F8F5EE; --surface:#FFFFFF; --sunk:#F0EBE0; --line:#E2DACA;
  --fg:#262B1C; --muted:#6B6D5C; --accent:#4E6A2E; --accent-ink:#FFFFFF; --accent-soft:#E6ECDA;
  --oil:#A07A33; --oil-soft:#F4EAD4; --gold:#B08A45;
  --warn:#9A5B00; --warn-soft:#FFF1D6; --bad:#B0322A; --bad-soft:#FBE3E0; --good:#2E7D4F;
  --t-reflex:#4E6A2E; --t-massage:#3D5A99; --t-acu:#9A4E5E; --t-aroma:#A07A33; --t-other:#6B6D5C;
  --f-display:"Frank Ruhl Libre","Assistant",Georgia,serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16180F; --surface:#1E2116; --sunk:#111309; --line:#33372A;
  --fg:#ECEADF; --muted:#A5A792; --accent:#A9C27E; --accent-ink:#16180F; --accent-soft:#2B3320;
  --oil:#D9B36A; --oil-soft:#3A2F1A; --gold:#D9B36A; --warn:#E9B45A; --warn-soft:#3A2D14; --bad:#F08A80; --bad-soft:#3D1D1A; --good:#7BCB98;
  --t-reflex:#A9C27E; --t-massage:#8FA8E6; --t-acu:#E09AA8; --t-aroma:#D9B36A; --t-other:#A5A792;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16180F; --surface:#1E2116; --sunk:#111309; --line:#33372A;
  --fg:#ECEADF; --muted:#A5A792; --accent:#A9C27E; --accent-ink:#16180F; --accent-soft:#2B3320;
  --oil:#D9B36A; --oil-soft:#3A2F1A; --gold:#D9B36A; --warn:#E9B45A; --warn-soft:#3A2D14; --bad:#F08A80; --bad-soft:#3D1D1A; --good:#7BCB98;
  --t-reflex:#A9C27E; --t-massage:#8FA8E6; --t-acu:#E09AA8; --t-aroma:#D9B36A; --t-other:#A5A792;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
#app{direction:rtl;max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;margin:0;min-width:0}
.brand img{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 1px 4px rgba(60,50,20,.18)}
.brand .nm{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.1;color:var(--accent)}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.78rem;color:var(--gold);letter-spacing:.02em}
h2.view,.file-head h2,.sheet h3,.stat b,.time,.day .n{font-weight:700}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:640px){
  header.top nav.tabs{position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
  nav.tabs button{flex:1;padding:10px 4px}
}

.banner{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:.92rem}
h2.view{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:20px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:5px 12px;font-size:.88rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 22px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}

.section-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.section-h h3{margin:0;font-size:1.05rem}
.section-h .count{color:var(--muted);font-size:.88rem}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:right;background:transparent;border-inline:0;border-bottom:0;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.item .main{flex:1;min-width:0}
.item .main .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .main .d{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-family:var(--f-display);font-size:1.15rem;min-width:3.4em;color:var(--fg)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.empty{padding:22px 16px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.flag{background:var(--bad-soft);color:var(--bad)}
.chip.unpaid{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--accent-soft);color:var(--accent)}
.chip.cancel{text-decoration:line-through}
.chip.example{background:var(--oil-soft);color:var(--oil)}

.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin-bottom:12px}

/* client file */
.file-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-top:18px}
.file-head .avatar{width:56px;height:56px;font-size:1.3rem}
.file-head h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0;line-height:1.2}
.file-head .meta{color:var(--muted)}
.alerts{margin:14px 0;padding:12px 14px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad);display:flex;flex-direction:column;gap:6px}
.alerts strong{font-size:.92rem}
.alerts .row{gap:6px}
.alerts .chip{background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
dl.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px;margin:0}
dl.kv div{min-width:0}
dl.kv dt{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;font-size:.8rem;padding:0 6px}
.prose{white-space:pre-wrap;overflow-wrap:anywhere}

.timeline{position:relative;display:flex;flex-direction:column;gap:12px;padding-inline-start:18px;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.tl{position:relative}
.tl::before{content:"";position:absolute;inset-inline-start:-25px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--tc,var(--accent));border:2px solid var(--bg)}
.tl .card{display:flex;flex-direction:column;gap:8px}
.tl .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .hd .date{font-weight:700}
.tl .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 16px}
.tl .fields div{min-width:0}
.tl .fields b{display:block;font-size:.76rem;color:var(--muted);font-weight:600}
.pain{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700}
.pain .arrow{color:var(--muted)}
.pain .down{color:var(--good)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 4px;text-align:center;cursor:pointer}
.day .n{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.day .w{font-size:.75rem;color:var(--muted)}
.day .c{font-size:.72rem;color:var(--accent);font-weight:700;min-height:1em}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day.today .n{color:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 12px}
.sheet{direction:rtl;background:var(--bg);border-radius:14px;width:100%;max-width:680px;padding:18px 18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media (max-width:640px){.overlay{padding:0;align-items:flex-start}.sheet{border-radius:0;min-height:100%;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:1.4rem;margin:0}
fieldset{border:0;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){fieldset{grid-template-columns:minmax(0,1fr)}}
legend{font-weight:700;color:var(--accent);margin-bottom:6px;font-size:.95rem;letter-spacing:.02em;padding:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.85rem;color:var(--muted);font-weight:600}
.f input:not([type=checkbox]):not([type=radio]):not([type=range]),.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.f label{font-size:.92rem}
.f textarea{min-height:72px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem;color:var(--fg);font-weight:400}
.checks input{accent-color:var(--accent);margin:0}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.checks.flags label:has(input:checked){border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;accent-color:var(--accent)}
.slider output{min-width:2ch;font-weight:700;font-variant-numeric:tabular-nums}
.sheet-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.err{color:var(--bad);font-size:.9rem;margin-top:10px}
.hint{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;flex:1 1 auto;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;cursor:pointer;font-weight:600;color:var(--fg);font-size:.95rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.block{margin-top:16px}
details.more{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px}
details.more summary{cursor:pointer;padding:13px 0;font-weight:700;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+  "}
details.more[open] summary::before{content:"−  "}
details.more fieldset{margin:0 0 16px}
details.more .f input:not([type=checkbox]):not([type=radio]):not([type=range]),details.more .f select,details.more .f textarea{background:var(--bg)}
fieldset.pair{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.sheet-actions{position:sticky;bottom:0;background:var(--bg);padding-block:12px;margin-top:16px;border-top:1px solid var(--line);z-index:1}
.confirm{margin-top:12px;padding:12px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-weight:600;direction:rtl}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<style>body{margin:0;-webkit-text-size-adjust:100%}[hidden]{display:none!important}img{max-width:100%}</style>

<body>


<div id="app" lang="he"></div>

<script>
(function(){
const TYPES={reflex:{n:"רפלקסולוגיה",c:"var(--t-reflex)"},massage:{n:"עיסוי רפואי",c:"var(--t-massage)"},acu:{n:"דיקור סיני",c:"var(--t-acu)"},aroma:{n:"ארומתרפיה",c:"var(--t-aroma)"},other:{n:"אחר",c:"var(--t-other)"}};
const FLAGS=["הריון","קוצב לב","מדללי דם","דליות / פקקת","אפילפסיה","סוכרת","לחץ דם גבוה","טיפול אונקולוגי","ניתוח לאחרונה","אלרגיה לשמנים","פחד ממחטים","בעיות עור"];
const AREAS={
  reflex:["ראש וסינוסים","צוואר וכתפיים","עמוד שדרה","מערכת עיכול","כבד ומרה","כליות ושלפוחית","לב וריאות","מערכת הורמונלית","מפרקים","לימפה"],
  massage:["צוואר","כתפיים","גב עליון","גב תחתון","ידיים","ירכיים","שוקיים","כפות רגליים","ראש ופנים","בטן"],
  acu:["ראש","צוואר וכתפיים","גב","בטן","ידיים","רגליים","אוזן"],
  aroma:["גב","צוואר וכתפיים","כפות רגליים","בטן","פנים","אינהלציה"],
  other:[]
};
const OILS=["לבנדר","אקליפטוס","מנטה","רוזמרין","קמומיל","ילנג ילנג","עץ התה","לימון","גרניום","מרווה"];
const PAY=["מזומן","אשראי","ביט / פייבוקס","העברה בנקאית","כרטיסייה"];
const DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];

const S={view:"today",clientId:null,q:"",day:null,weekStart:null,mode:"loading",clients:{},sessions:{},showAllDetails:false};
let db=null, downloads=null;
const app=document.getElementById("app");

// ---------- helpers
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const weekStartOf=s=>{const d=parse(s);d.setDate(d.getDate()-d.getDay());return ymd(d)};
const fmtDate=s=>{if(!s)return"";const d=parse(s);return DAYS[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2)};
const fmtShort=s=>{if(!s)return"";const d=parse(s);return d.getDate()+"."+(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2)};
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nis=n=>"₪"+Number(n||0).toLocaleString("he-IL");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fullName=c=>c?((c.first||"")+" "+(c.last||"")).trim()||"ללא שם":"לקוח שנמחק";
const initials=c=>{const n=fullName(c).split(/\s+/);return (n[0]||"")[0]+((n[1]||"")[0]||"")};
const age=b=>{if(!b)return"";const d=parse(b),t=new Date();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a};
const typeChip=t=>{const T=TYPES[t]||TYPES.other;return `<span class="chip" style="color:${T.c}"><span class="dot"></span>${T.n}</span>`};
const sessionsOf=id=>Object.entries(S.sessions).filter(([,s])=>s.clientId===id).map(([k,s])=>({id:k,...s})).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
const allSessions=()=>Object.entries(S.sessions).map(([k,s])=>({id:k,...s}));
const lastVisit=id=>{const d=sessionsOf(id).filter(s=>s.status==="done");return d[0]?d[0].date:""};

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

// ---------- data layer
// כתובת ה-Web App של Google Apps Script. אפשר להדביק כאן, או להזין במסך הכניסה.
const CFG_URL = "https://script.google.com/macros/s/AKfycbzXgcKjwdJn0TuhRRngHIvvfuFH023LvkrfziYaE3VZzYXeG-777E0FJOMXhLXiHJWc7g/exec";
function cfg(){let u=CFG_URL.indexOf("PASTE")>=0?"":CFG_URL,t="";try{u=localStorage.getItem("es_url")||u;t=localStorage.getItem("es_token")||""}catch(e){}return {u,t}}
async function api(action,payload={}){
  const {u,t}=cfg();
  let r;
  try{r=await fetch(u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:t,...payload})})}
  catch(e){const x=new Error("אין חיבור לאינטרנט");x.code="network";throw x}
  let j;try{j=await r.json()}catch(e){const x=new Error("השרת בגוגל לא החזיר תשובה תקינה");x.code="bad_response";throw x}
  if(!j.ok){const x=new Error(j.error==="bad_token"?"קוד הגישה שגוי":(j.error||"שגיאה"));x.code=j.error;throw x}
  return j;
}
async function put(col,id,data){
  const body=col==="sessions"?{...data,clientName:fullName(S.clients[data.clientId])}:data;
  await api(col==="clients"?"saveClient":"saveSession",{id,data:body});
  S[col][id]=data;render();
}
async function del(col,id){
  await api(col==="clients"?"deleteClient":"deleteSession",{id});
  delete S[col][id];
  if(col==="clients")for(const [k,s] of Object.entries(S.sessions))if(s.clientId===id)delete S.sessions[k];
  render();
}
async function load(){const j=await api("load");S.clients=j.clients||{};S.sessions=j.sessions||{};S.syncErr=""}

function demoData(){

async function init(){
  S.day=S.day||today();S.weekStart=S.weekStart||weekStartOf(S.day);
  const {u,t}=cfg();
  if(!u||!t){S.mode="setup";render();return}
  S.mode="loading";render();
  try{await load();S.mode="ready";render()}
  catch(e){
    if(e.code==="bad_token"){try{localStorage.removeItem("es_token")}catch(x){}S.setupErr="קוד הגישה שגוי.";S.mode="setup"}
    else if(e.code==="bad_response"){S.setupErr="הכתובת לא נכונה, או שהסקריפט לא פורסם עם גישה ל״כל אחד״.";S.mode="setup"}
    else S.mode="offline";
    render();
  }
}

const tab=(v,label)=>`<button data-go="${v}" ${S.view===v||(v==="clients"&&S.view==="client")?'aria-current="page"':""}>${label}</button>`;

function sessionRow(s,showClient=true){
  const c=S.clients[s.clientId];
  const flags=c&&c.flags&&c.flags.length?`<span class="chip flag">${c.flags.length} התראות</span>`:"";
  const status=s.status==="done"?`<span class="chip done">תועד</span>`:s.status==="canceled"?`<span class="chip cancel">בוטל</span>`:"";
  const unpaid=s.status==="done"&&!s.paid&&s.price?`<span class="chip unpaid">לא שולם</span>`:"";
  return `<button class="item" data-session="${s.id}">
    <span class="time num">${esc(s.time||"--:--")}</span>
    <span class="main"><span class="t">${showClient?esc(fullName(c)):fmtDate(s.date)} ${typeChip(s.type)} ${flags}${status}${unpaid}</span>
    <span class="d">${s.duration?s.duration+" דק׳":""}${s.price?" · "+nis(s.price):""}${s.complaint?" · "+esc(s.complaint):""}</span></span>
  </button>`;
}

function viewSetup(){
  const {u}=cfg(); const needUrl=CFG_URL.indexOf("PASTE")>=0;
  return `<form id="setup" class="card" style="margin:24px auto 0;max-width:460px;display:flex;flex-direction:column;gap:14px">
    <h2 class="view" style="margin:0">כניסה</h2>
    <p class="sub" style="margin:0">התיקים נשמרים בגוגל שיטס. הכניסה נשמרת במכשיר הזה.</p>
    ${needUrl?`<div class="f"><label for="url">כתובת ה-Web App (מגוגל Apps Script)</label><input id="url" name="url" type="url" dir="ltr" value="${esc(u)}" placeholder="https://script.google.com/macros/s/…/exec"></div>`:""}
    <div class="f"><label for="token">קוד גישה</label><input id="token" name="token" type="password" autocomplete="current-password"></div>
    ${S.setupErr?`<div class="err" style="margin:0">${esc(S.setupErr)}</div>`:""}
    <div><button class="btn primary" type="submit">כניסה</button></div>
  </form>`;
}

function viewToday(){
  const t=today(), all=allSessions();
  const todays=all.filter(s=>s.date===t&&s.status!=="canceled").sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const month=t.slice(0,7);
  const doneMonth=all.filter(s=>s.status==="done"&&s.date.startsWith(month));
  const income=doneMonth.filter(s=>s.paid).reduce((a,s)=>a+Number(s.price||0),0);
  const unpaid=all.filter(s=>s.status==="done"&&!s.paid&&Number(s.price)>0).sort((a,b)=>b.date.localeCompare(a.date));
  const toDocument=all.filter(s=>s.status==="planned"&&s.date<t).sort((a,b)=>b.date.localeCompare(a.date));
  const nClients=Object.keys(S.clients).length;
  const upcoming=all.filter(s=>s.status==="planned"&&s.date>t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
  const example=Object.values(S.clients).some(c=>c.example);
  return `
  <h2 class="view">${todays.length?`${todays.length} טיפולים היום`:"אין טיפולים היום"}</h2>
  <p class="sub">${fmtDate(t)}</p>
  <div class="row"><button class="btn primary" data-act="new-session">+ קביעת תור / תיעוד טיפול</button><button class="btn" data-act="new-client">+ לקוח חדש</button></div>
  ${nClients===0?`<div class="empty" style="margin-top:18px">עוד אין לקוחות. התחל ב״לקוח חדש״ ומלא פרטים והצהרת בריאות, ואז קבע לו תור.</div>`:""}
  ${example?`<div class="banner" style="background:var(--oil-soft);color:var(--oil)">יש כאן לקוחות לדוגמה כדי שתראה איך זה נראה. <button class="btn small" data-act="clear-examples">מחק את נתוני הדוגמה</button></div>`:""}
  <div class="stats" style="margin-top:18px">
    <div class="stat"><b class="num">${nClients}</b><span>לקוחות בתיק</span></div>
    <div class="stat"><b class="num">${doneMonth.length}</b><span>טיפולים החודש</span></div>
    <div class="stat"><b class="num">${nis(income)}</b><span>הכנסות ששולמו החודש</span></div>
    <div class="stat"><b class="num" style="color:${unpaid.length?"var(--warn)":"inherit"}">${unpaid.length}</b><span>טיפולים שלא שולמו</span></div>
  </div>
  <div class="section-h"><h3>התורים של היום</h3><span class="count">${todays.length}</span></div>
  ${todays.length?`<div class="list">${todays.map(s=>sessionRow(s)).join("")}</div>`:`<div class="empty">היומן פנוי היום.</div>`}
  ${toDocument.length?`<div class="section-h"><h3>תורים שעברו וממתינים לתיעוד</h3><span class="count">${toDocument.length}</span></div><div class="list">${toDocument.map(s=>sessionRow(s)).join("")}</div>`:""}
  ${upcoming.length?`<div class="section-h"><h3>הבאים בתור</h3></div><div class="list">${upcoming.map(s=>sessionRow(s).replace('<span class="time num">',`<span class="time num" title="${fmtDate(s.date)}">`).replace(/<span class="d">/,`<span class="d">${fmtDate(s.date)} · `)).join("")}</div>`:""}
  ${unpaid.length?`<div class="section-h"><h3>חובות פתוחים</h3><span class="count">${nis(unpaid.reduce((a,s)=>a+Number(s.price||0),0))}</span></div><div class="list">${unpaid.map(s=>sessionRow(s).replace(/<span class="d">/,`<span class="d">${fmtDate(s.date)} · `)).join("")}</div>`:""}
  `;
}

function viewClients(){
  const q=S.q.trim().toLowerCase();
  let list=Object.entries(S.clients).map(([id,c])=>({id,c,last:lastVisit(id),n:sessionsOf(id).filter(s=>s.status==="done").length}));
  if(q) list=list.filter(({c})=>[fullName(c),c.phone,c.phone2,c.city,c.email].join(" ").toLowerCase().replace(/-/g,"").includes(q.replace(/-/g,"")));
  list.sort((a,b)=>(b.last||"").localeCompare(a.last||"")||fullName(a.c).localeCompare(fullName(b.c),"he"));
  return `
  <div class="row" style="margin-top:20px"><h2 class="view" style="margin:0">לקוחות</h2><span class="spacer"></span>
    <button class="btn small" data-act="refresh">רענון</button>
    <button class="btn primary" data-act="new-client">+ לקוח חדש</button></div>
  <p class="sub">${Object.keys(S.clients).length} תיקים</p>
  <input id="q" class="search" type="search" placeholder="חיפוש לפי שם, טלפון או עיר" value="${esc(S.q)}" aria-label="חיפוש לקוח">
  ${list.length?`<div class="list">${list.map(({id,c,last,n})=>`
    <button class="item" data-client="${id}">
      <span class="avatar">${esc(initials(c))}</span>
      <span class="main"><span class="t">${esc(fullName(c))}${c.flags&&c.flags.length?`<span class="chip flag">${c.flags.map(esc).join(" · ")}</span>`:""}</span>
      <span class="d num">${esc(c.phone||"")}${c.city?" · "+esc(c.city):""} · ${n} טיפולים${last?" · אחרון "+fmtShort(last):""}</span></span>
    </button>`).join("")}</div>`
  :`<div class="empty">${q?"לא נמצא לקוח בשם או בטלפון הזה.":"עוד אין לקוחות. לחץ ״לקוח חדש״ כדי לפתוח תיק ראשון."}</div>`}`;
}

function viewClient(){
  const id=S.clientId,c=S.clients[id];
  if(!c) return `<div class="empty" style="margin-top:24px">התיק לא נמצא. <button class="btn small" data-go="clients">חזרה לרשימה</button></div>`;
  const ses=sessionsOf(id), done=ses.filter(s=>s.status==="done");
  const planned=ses.filter(s=>s.status==="planned"&&s.date>=today()).reverse();
  const debt=done.filter(s=>!s.paid).reduce((a,s)=>a+Number(s.price||0),0);
  const consentOld=!c.consentDate||(Date.now()-parse(c.consentDate).getTime())>365*864e5;
  const kv=(k,v,copy)=>v?`<div><dt>${k}</dt><dd>${esc(v)}${copy?`<button class="copy" data-copy="${esc(v)}">העתק</button>`:""}</dd></div>`:"";
  return `
  <button class="btn ghost" data-go="clients" style="margin-top:12px">→ כל הלקוחות</button>
  <div class="file-head">
    <span class="avatar">${esc(initials(c))}</span>
    <div style="flex:1;min-width:0">
      <h2>${esc(fullName(c))}</h2>
      <div class="meta num">${[c.birth?"גיל "+age(c.birth):"",c.gender,c.city,done.length+" טיפולים",done[0]?"אחרון "+fmtShort(done[0].date):""].filter(Boolean).map(esc).join(" · ")}</div>
    </div>
    <div class="row">
      <button class="btn primary" data-act="new-session" data-cid="${id}">+ טיפול / תור</button>
      <button class="btn" data-act="edit-client" data-cid="${id}">עריכת פרטים</button>
    </div>
  </div>
  ${c.flags&&c.flags.length||c.allergies?`<div class="alerts" role="note"><strong>לתשומת לב לפני טיפול</strong><div class="row">${(c.flags||[]).map(f=>`<span class="chip flag">${esc(f)}</span>`).join("")}</div>${c.allergies?`<div>אלרגיות: ${esc(c.allergies)}</div>`:""}</div>`:""}
  ${consentOld?`<div class="banner">${c.consentDate?"הצהרת הבריאות נחתמה לפני יותר משנה ("+fmtShort(c.consentDate)+"). כדאי לעדכן.":"אין תאריך חתימה על הצהרת בריאות."}</div>`:""}
  ${debt?`<div class="banner">יתרה לתשלום: <b class="num">${nis(debt)}</b></div>`:""}

  <div class="section-h"><h3>פרטים אישיים</h3></div>
  <div class="card"><dl class="kv">

function sessionCard(s){
  const T=TYPES[s.type]||TYPES.other;
  const f=(k,v)=>v?`<div><b>${k}</b><span class="prose">${esc(v)}</span></div>`:"";
  const pain=(s.painBefore!=null&&s.painBefore!=="")?`<span class="pain" title="רמת כאב 0–10">כאב ${s.painBefore}<span class="arrow">←</span><span class="${Number(s.painAfter)<Number(s.painBefore)?"down":""}">${s.painAfter??"–"}</span></span>`:"";
  return `<div class="tl" style="--tc:${T.c}"><div class="card">
    <div class="hd"><span class="date">${fmtDate(s.date)}</span><span class="num" style="color:var(--muted)">${esc(s.time||"")}${s.duration?" · "+s.duration+" דק׳":""}</span>${typeChip(s.type)}${pain}<span class="spacer"></span>
      ${s.price?`<span class="chip ${s.paid?"done":"unpaid"} num">${nis(s.price)} ${s.paid?"שולם":"לא שולם"}</span>`:""}
      <button class="btn small" data-session="${s.id}">עריכה</button></div>
    <div class="fields">
      ${f("תלונה / סיבת הגעה (S)",s.complaint)}${f("ממצאים בבדיקה (O)",s.findings)}${f("מה נעשה בטיפול (A)",s.treatment)}
      ${s.areas&&s.areas.length?f("אזורים שטופלו",s.areas.join(", ")):""}${f("נקודות דיקור",s.points)}
      ${s.oils&&s.oils.length?f("שמנים",s.oils.join(", ")+(s.dilution?" · "+s.dilution:"")):""}
      ${f("תגובת הלקוח",s.reaction)}${f("המלצות לבית",s.homeCare)}${f("תוכנית להמשך (P)",s.nextPlan)}
    </div></div></div>`;
}

function viewCalendar(){
  const ws=S.weekStart, t=today(), all=allSessions().filter(s=>s.status!=="canceled");
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const dayList=allSessions().filter(s=>s.date===S.day).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const d0=parse(days[0]),d6=parse(days[6]);
  return `
  <div class="row" style="margin-top:20px"><h2 class="view" style="margin:0">יומן</h2><span class="spacer"></span>
    <button class="btn small" data-act="week" data-d="-7" aria-label="שבוע קודם">→</button>
    <button class="btn small" data-act="week" data-d="0">היום</button>
    <button class="btn small" data-act="week" data-d="7" aria-label="שבוע הבא">←</button></div>
  <p class="sub num">${d0.getDate()}.${d0.getMonth()+1} – ${d6.getDate()}.${d6.getMonth()+1}.${d6.getFullYear()}</p>
  <div class="week">${days.map(d=>{const n=all.filter(s=>s.date===d).length,x=parse(d);return `<button class="day ${d===t?"today":""}" data-day="${d}" aria-pressed="${d===S.day}"><div class="w">${DAYS[x.getDay()]}</div><div class="n num">${x.getDate()}</div><div class="c">${n?n+" תורים":""}</div></button>`}).join("")}</div>
  <div class="row"><h3 style="margin:0">${fmtDate(S.day)}</h3><span class="spacer"></span><button class="btn primary small" data-act="new-session" data-date="${S.day}">+ תור ביום הזה</button></div>
  <div style="margin-top:10px">${dayList.length?`<div class="list">${dayList.map(s=>sessionRow(s)).join("")}</div>`:`<div class="empty">אין תורים ביום הזה.</div>`}</div>`;
}

      <div class="f full"><label>מה רושמים?</label><div class="seg">${[["planned","קביעת תור"],["done","תיעוד טיפול שבוצע"],["canceled","בוטל"]].map(([v,l])=>`<label><input type="radio" name="status" value="${v}" ${s.status===v?"checked":""}>${l}</label>`).join("")}</div></div>
      <div class="f full"><label>סוג טיפול</label><div class="seg">${Object.entries(TYPES).map(([k,T])=>`<label><input type="radio" name="type" value="${k}" ${s.type===k?"checked":""}>${T.n}</label>`).join("")}</div></div>
    </fieldset>
    <fieldset class="pair">${inp("date","תאריך",s.date,"date")}${inp("time","שעה",s.time,"time")}</fieldset>

      ${inp("price","מחיר (₪)",s.price,"number")}
      <div class="f"><label>&nbsp;</label><div class="checks"><label style="padding:10px 14px"><input type="checkbox" name="paid" id="paid" ${s.paid?"checked":""}>שולם</label></div></div>
    </fieldset>
    <details class="more"><summary>משך הטיפול ואמצעי תשלום</summary><fieldset class="pair">

      <div class="f"><label for="payMethod">אמצעי תשלום</label><select id="payMethod" name="payMethod"><option value=""></option>${PAY.map(p=>`<option ${s.payMethod===p?"selected":""}>${p}</option>`).join("")}</select></div>
    </fieldset></details>
    <div class="err" id="sf-err" hidden></div>

  </form>`);
  const f=sheetEl.querySelector("#sf");
  const docsHtml=()=>{
    const st=f.querySelector('[name=status]:checked')?.value, ty=f.querySelector('[name=type]:checked')?.value||"other";

    const cur=collectDocs()||s;
    const extraOpen=!!(cur.findings||cur.reaction||cur.homeCare||cur.points||cur.dilution||(cur.areas&&cur.areas.length)||(cur.oils&&cur.oils.length));
    const extraName=ty==="aroma"?"שמנים, אזורים, ממצאים":ty==="acu"?"נקודות דיקור, אזורים, ממצאים":"אזורים שטופלו, ממצאים";
    return `<fieldset><legend class="f full">תיעוד הטיפול</legend>
      ${area("complaint","ממה הלקוח סובל היום?",cur.complaint)}
      ${area("treatment","מה עשית בטיפול?",cur.treatment)}

    <fieldset class="pair">

      ${ty==="acu"?inp("points","נקודות דיקור (למשל LI4, ST36)",cur.points,"text","full"):""}

      ${area("findings","ממצאים בבדיקה",cur.findings)}

    const o={...(sid?S.sessions[sid]:{}),clientId:fd.get("clientId"),date:fd.get("date"),time:fd.get("time"),type:fd.get("type"),duration:Number(fd.get("duration")),status:fd.get("status")||"planned",price:fd.get("price")===""?"":Number(fd.get("price")),payMethod:fd.get("payMethod")||"",paid:!!fd.get("paid")};
    if(!o.clientId){err.textContent="בחר לקוח.";err.hidden=false;return}
    if(!o.date){err.textContent="בחר תאריך.";err.hidden=false;return}
    const d=collectDocs();if(d)Object.assign(o,d);
    o.updatedAt=Date.now();if(!sid)o.createdAt=Date.now();
    const sb=f.querySelector('[type=submit]');sb.disabled=true;sb.textContent="שומר…";
    try{await put("sessions",sid||uid(),o);closeSheet();render();toast(o.status==="done"?"הטיפול תועד":"התור נשמר")}
    catch(x){sb.disabled=false;sb.textContent="שמירה";err.textContent="השמירה נכשלה: "+((x&&x.message)||"שגיאה")+". נסו שוב.";err.hidden=false}
  });
  f.addEventListener("click",async e=>{
    const a=e.target.closest("[data-act]");if(!a)return;
    if(a.dataset.act==="ask-del-s")f.querySelector("#del-zone").innerHTML=`<div class="confirm">למחוק את הרישום הזה? <div class="row" style="margin-top:8px"><button type="button" class="btn danger" data-act="del-s">כן, למחוק</button><button type="button" class="btn" data-act="no-del">ביטול</button></div></div>`;
    if(a.dataset.act==="no-del")f.querySelector("#del-zone").innerHTML="";
    if(a.dataset.act==="del-s"){a.disabled=true;a.textContent="מוחק…";try{await del("sessions",sid)}catch(x){toast("המחיקה נכשלה: "+x.message);a.disabled=false;return}closeSheet();render();toast("נמחק")}
  });
}
function nextHalfHour(){const d=new Date();d.setMinutes(d.getMinutes()<30?30:60,0,0);return pad(d.getHours())+":"+pad(d.getMinutes())}

async function exportCsv(){
  const cols=[["first","שם פרטי"],["last","שם משפחה"],["phone","טלפון"],["phone2","טלפון נוסף"],["email","אימייל"],["address","כתובת"],["city","עיר"],["birth","תאריך לידה"],["referral","הגיע דרך"],["consentDate","הצהרת בריאות"]];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=[cols.map(c=>q(c[1])).concat(q("מס׳ טיפולים"),q("ביקור אחרון")).join(",")];
  for(const [id,c] of Object.entries(S.clients)){rows.push(cols.map(k=>q(c[k[0]])).concat(q(sessionsOf(id).filter(s=>s.status==="done").length),q(lastVisit(id))).join(","))}
  try{await downloads.save({filename:"לקוחות-"+today()+".csv",data:new Blob(["﻿"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"})});toast("הקובץ מוכן")}catch(e){toast("ההורדה בוטלה")}
}

// ---------- events
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g&&!sheetEl){S.view=g.dataset.go;S.clientId=null;render();window.scrollTo(0,0);return}
  const c=e.target.closest("[data-client]");if(c){S.view="client";S.clientId=c.dataset.client;render();window.scrollTo(0,0);return}
  const ses=e.target.closest("[data-session]");if(ses&&!sheetEl){sessionForm(ses.dataset.session);return}
  const day=e.target.closest("[data-day]");if(day){S.day=day.dataset.day;render();return}
  const cp=e.target.closest("[data-copy]");if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);toast("הועתק")}catch(x){toast(cp.dataset.copy)}return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="close")closeSheet();
  else if(act==="new-client"){clientForm(null)}
  else if(act==="edit-client")clientForm(a.dataset.cid);
  else if(act==="new-session"&&!sheetEl)sessionForm(null,{clientId:a.dataset.cid||(S.view==="client"?S.clientId:""),date:a.dataset.date});
  else if(act==="week"){const d=Number(a.dataset.d);if(d===0){S.day=today();S.weekStart=weekStartOf(S.day)}else{S.weekStart=addDays(S.weekStart,d);S.day=S.weekStart}render()}
  else if(act==="export")exportCsv();
  else if(act==="retry")init();
  else if(act==="refresh"){a.disabled=true;load().then(()=>{render();toast("עודכן מגוגל שיטס")}).catch(x=>{toast(x.message);a.disabled=false})}
  else if(act==="logout"){try{localStorage.removeItem("es_token")}catch(x){}S.setupErr="";S.mode="setup";render()}
  else if(act==="clear-examples"){for(const [id,s] of Object.entries(S.sessions))if(s.example)await del("sessions",id);for(const [id,cl] of Object.entries(S.clients))if(cl.example)await del("clients",id);toast("נתוני הדוגמה נמחקו")}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetEl)closeSheet()});
document.addEventListener("click",e=>{if(sheetEl&&e.target===sheetEl)closeSheet()});

document.addEventListener("submit",e=>{
  if(e.target.id!=="setup")return;e.preventDefault();
  const fd=new FormData(e.target);
  try{const u=(fd.get("url")||"").trim();if(u)localStorage.setItem("es_url",u);localStorage.setItem("es_token",(fd.get("token")||"").trim())}catch(x){}
  S.setupErr="";init();
});

init();
})();
</script>

</body>
</html>
